<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>My AI</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #343541;
  color: white;
}

header {
  padding: 15px;
  text-align: center;
  background: #202123;
  font-weight: bold;
}

#chat {
  height: calc(100vh - 120px);
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 700px;
  margin: 10px auto;
  padding: 12px 15px;
  border-radius: 10px;
  line-height: 1.4;
}

.user {
  background: #0b93f6;
  margin-left: auto;
  text-align: right;
}

.bot {
  background: #444654;
  margin-right: auto;
}

#inputArea {
  display: flex;
  padding: 15px;
  background: #202123;
  position: fixed;
  bottom: 0;
  width: 100%;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  border: none;
  outline: none;
  background: #40414f;
  color: white;
}

button {
  margin-left: 10px;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  background: #19c37d;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<header>My ChatGPT Clone 🤖</header>

<div id="chat"></div>

<div id="inputArea">
  <input id="input" placeholder="Message..." />
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

function addMessage(text, type) {
  const div = document.createElement("div");
  div.className = "message " + type;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value;
  if (!text) return;

  addMessage(text, "user");
  input.value = "";

  // show temporary loading message
  const loadingId = "loading";
  addMessage("Typing...", "bot");

  const res = await fetch("https://YOUR-RENDER-URL.onrender.com/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: text })
  });

  const data = await res.json();

  // remove last "Typing..."
  chat.lastChild.remove();

  const reply = data.choices[0].message.content;
  addMessage(reply, "bot");
}
</script>

</body>
</html>
